# Example configuration.yaml for Canaan Avalon Miner Integration
# This replaces the shell_command, command_line, input_text, input_boolean, 
# and template switch configurations for Avalon miners

# Configure your Canaan Avalon miners
canaan:
  - host: 172.16.0.81
    name: "Exergy Office Mini 3"
    port: 4028
    scan_interval: 30
  - host: 172.16.0.82
    name: "Upstairs Conference Room Mini 3"
    port: 4028
    scan_interval: 30
  - host: 172.16.0.84
    name: "Avalon Q"
    port: 4028
    scan_interval: 30

# Use the power switches with generic_thermostat
climate:
  - platform: generic_thermostat
    name: Exergy Office
    heater: switch.exergy_office_mini_3_power
    target_sensor: sensor.exergy_office_sensor_temperature
    min_temp: 60
    max_temp: 80
    ac_mode: false
    target_temp: 70
    cold_tolerance: 1
    hot_tolerance: 1
    min_cycle_duration:
      seconds: 10
    keep_alive:
      minutes: 3
    initial_hvac_mode: "heat"
    precision: .5
    
  - platform: generic_thermostat
    name: Upstairs Conference Room
    heater: switch.upstairs_conference_room_mini_3_power
    target_sensor: sensor.upstairs_conference_room_sensor_temperature
    min_temp: 60
    max_temp: 80
    ac_mode: false
    target_temp: 75
    cold_tolerance: 1
    hot_tolerance: 1
    min_cycle_duration:
      seconds: 10
    keep_alive:
      minutes: 3
    initial_hvac_mode: "heat"
    precision: .5

# Optional: Automations to set work mode and level when power switch is toggled
automation:
  - alias: "Exergy Office Mini 3 - Set Mining Mode on Power On"
    trigger:
      - platform: state
        entity_id: switch.exergy_office_mini_3_power
        to: 'on'
        from: 'off'
    action:
      - delay: 2  # Wait for miner to initialize
      - service: select.select_option
        target:
          entity_id: select.exergy_office_mini_3_work_mode
        data:
          option: "Mining"
      - delay: 1
      - service: select.select_option
        target:
          entity_id: select.exergy_office_mini_3_work_level
        data:
          option: "Super"
          
  - alias: "Upstairs Conference Room Mini 3 - Set Mining Mode on Power On"
    trigger:
      - platform: state
        entity_id: switch.upstairs_conference_room_mini_3_power
        to: 'on'
        from: 'off'
    action:
      - delay: 2  # Wait for miner to initialize
      - service: select.select_option
        target:
          entity_id: select.upstairs_conference_room_mini_3_work_mode
        data:
          option: "Mining"
      - delay: 1
      - service: select.select_option
        target:
          entity_id: select.upstairs_conference_room_mini_3_work_level
        data:
          option: "Super"

# Keep your existing scrape sensors for Ocean.xyz earnings
scrape:
  - resource: https://ocean.xyz/stats/bc1qmlmvl0j8ufdtllml65xjl8xf2z06fn40p3qkvv.Exergy_Office
    scan_interval: 300
    sensor:
      - name: "Exergy Office Lifetime Earnings"
        select: "div.blocks-label:contains('Lifetime Earnings') ~ span"
        value_template: >
          {% set clean = value | replace(' BTC', '') | replace(',', '') | replace('\n', '') | trim %}
          {{ clean }}
        unit_of_measurement: "BTC"
        state_class: total_increasing
        
  - resource: https://ocean.xyz/stats/bc1qmlmvl0j8ufdtllml65xjl8xf2z06fn40p3qkvv.Upstairs_Conference_Room
    scan_interval: 300
    sensor:
      - name: "Upstairs Conference Room Lifetime Earnings"
        select: "div.blocks-label:contains('Lifetime Earnings') ~ span"
        value_template: >
          {% set clean = value | replace(' BTC', '') | replace(',', '') | replace('\n', '') | trim %}
          {{ clean }}
        unit_of_measurement: "BTC"
        state_class: total_increasing

